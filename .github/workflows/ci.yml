name: Code quality CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: "1.95.0"
          components: rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: "1.95.0"
          components: clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Run clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        # The action exports RUSTUP_TOOLCHAIN, which outranks rust-toolchain.toml,
        # so the version here must match the pin in rust-toolchain.toml.
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: "1.95.0"
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Run workspace tests
        run: cargo test --locked --workspace --all-features

      - name: Build independent core consumer
        run: cargo run --locked --manifest-path examples/embedded-policy/Cargo.toml

      - name: Verify wrapper enforcement handshake test
        # --exact needs the full module path; a bare name matches 0 tests and
        # passes vacuously. The grep guard fails the step if the test ever
        # stops running (renamed/moved), instead of silently passing.
        run: |
          cargo test --locked -p opaqued tests::enforce_agent_sessions_rejects_unwrapped_and_allows_session_token -- --exact 2>&1 | tee /tmp/wrapper-test.out
          grep -q "test result: ok. 1 passed" /tmp/wrapper-test.out

  test-macos:
    name: Native macOS tests
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@v2
      - name: Run native workspace tests
        run: cargo test --locked --workspace --all-features
      - name: Verify native reviewer package without installing
        run: |
          cargo build --locked -p opaque-approver -p opaque-approve-helper
          reviewer_pkg_dir=$(mktemp -d "${RUNNER_TEMP}/opaque-reviewer.XXXXXX")
          trap 'rm -rf "$reviewer_pkg_dir"' EXIT
          python3 scripts/package-reviewer-macos.py --binary-dir target/debug --output "$reviewer_pkg_dir/OpaqueReviewer.app" --architecture "$(uname -m)" --ad-hoc
          "$reviewer_pkg_dir/OpaqueReviewer.app/Contents/MacOS/OpaqueReviewer" --self-test
          codesign --verify --deep --strict "$reviewer_pkg_dir/OpaqueReviewer.app"

  python:
    name: Python protocol, evidence and operator tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.11"
          cache: pip
          cache-dependency-path: |
            scripts/requirements-test.txt
            docs/requirements.txt
      - name: Install pinned test dependencies
        run: python -m pip install --disable-pip-version-check -r scripts/requirements-test.txt
      - name: Run every Python regression without skips
        # Linux runs the real peer-credential/parent-death cases. Installing the
        # pinned FIDO2 library makes its API-contract cases mandatory as well.
        run: |
          python -B - <<'PYTEST'
          import sys
          import unittest
          for directory in ("scripts",):
              suite = unittest.TestLoader().discover(directory, pattern="test_*.py")
              result = unittest.TextTestRunner(verbosity=2).run(suite)
              if not result.wasSuccessful() or not result.testsRun or result.skipped:
                  print(f"Required suite {directory}: failures, missing tests, or skipped tests", file=sys.stderr)
                  sys.exit(1)
          PYTEST

  javascript:
    name: JavaScript privacy and browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "26.8.1"
      - name: Run all Node regression suites
        # The customer demo has its own repository. All three suites here are
        # required: fail glob expansion if any directory loses its test files.
        run: |
          shopt -s failglob
          node --test \
            deploy/cloudflare-docs-privacy/tests/*.test.mjs \
            crates/opaque-showcase/tests/*.test.cjs \
            crates/opaque-web/tests/*.test.cjs

  site-privacy:
    name: Generated visitor site privacy
    # This is a read-only build gate in both repositories, including fork PRs.
    # Publication remains separately guarded in the deployment workflows.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.11"
          cache: pip
          cache-dependency-path: |
            scripts/requirements-test.txt
            docs/requirements.txt
      - name: Install pinned documentation tools
        run: python -m pip install --disable-pip-version-check -r scripts/requirements-test.txt
      - name: Check privacy gate regressions
        run: python -B -m unittest discover -s scripts -p test_check_site_privacy.py
      - name: Build and inspect all publication artifacts
        # The temporary source includes private sentinels. It and its generated
        # site are deliberately never uploaded as a preview or Actions artifact.
        run: python -B scripts/check_site_privacy.py --build

  # Verifies the Linux-only trust-domain guarantees (separate-uid custody,
  # Landlock, seccomp). The probe runs FIRST and fails the job if the runner
  # kernel can't enforce Landlock/seccomp — so the enforcement tests that later
  # steps run can never green-skip on an incapable kernel. Locally the same
  # entry points run via `scripts/linux-harness.sh` (Docker on macOS; note
  # Docker Desktop's linuxkit kernel lacks Landlock, so Landlock enforcement
  # is verified here and only here).
  trust-domain-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        # Keep in sync with rust-toolchain.toml (the action's RUSTUP_TOOLCHAIN
        # export outranks the file).
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: "1.95.0"

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Kernel capability probe (landlock + seccomp must be enforceable)
        run: ./scripts/linux-harness.sh probe

      - name: Federation e2e (signed bundles, chain-verifiable export, attestation)
        # Runs BEFORE the root-gated suites on purpose: those invoke cargo
        # under sudo and leave root-owned artifacts in target/, which a later
        # non-root cargo cannot lock. The grep fails the step if the suite
        # ever stops running (renamed/moved), instead of passing vacuously.
        run: |
          cargo test --locked -p opaqued --test federation_e2e 2>&1 | tee /tmp/fed-e2e.out
          grep -q "test result: ok. 3 passed" /tmp/fed-e2e.out

      - name: Provider e2e (canonical authority and real mock-provider effects)
        # Require original positive controls and the canonical-action regressions,
        # while allowing the suite to grow. Run before root-owned build artifacts.
        run: |
          set -o pipefail
          cargo test --locked -p opaqued --test provider_e2e 2>&1 | tee /tmp/prov-e2e.out
          grep -Eq "test result: ok\. [1-9][0-9]* passed; 0 failed" /tmp/prov-e2e.out
          for required in \
            github_set_actions_secret_succeeds_end_to_end \
            unlisted_provider_operation_is_policy_denied \
            canonical_action_rejects_target_substitution_before_approval_and_provider_io \
            canonical_action_derives_omitted_targets_for_policy_and_equivalent_dispatch \
            canonical_action_rejects_malformed_targets_and_unknown_provider_fields \
            canonical_action_policy_includes_implicit_token_refs_and_ignores_forged_ref_lists \
            canonical_action_policy_constrains_actual_secret_scope_and_environment \
            canonical_action_rejects_task_only_operations_under_allow_all_policy \
            canonical_reference_metadata_rejects_secret_bytes_before_audit_or_review; do
            grep -Fxq "test ${required} ... ok" /tmp/prov-e2e.out
          done

      - name: MCP broker e2e (signed tools, approval, durable charges, real fixture effects)
        run: |
          set -o pipefail
          cargo build --locked -p opaque-mcp --bin opaque-mcp
          cargo test --locked -p opaque-bounded-work mcp:: --lib
          cargo test --locked -p opaqued --bin opaqued mcp_approval_reviews
          cargo test --locked -p opaqued --test mcp_gateway_e2e 2>&1 | tee /tmp/mcp-e2e.out
          grep -Eq "test result: ok\. [1-9][0-9]* passed; 0 failed" /tmp/mcp-e2e.out
          for required in \
            adapter_signed_tool_daemon_effect_receipt_and_replay_survive_restart \
            policy_denial_malformed_input_and_generic_bypass_make_no_http_calls \
            revoke_during_handshake_stops_final_tool_dispatch_and_does_not_refund \
            daemon_death_after_effect_recovers_unknown_and_never_replays \
            expiry_during_handshake_prevents_tool_effect_and_preserves_charge; do
            grep -Fxq "test ${required} ... ok" /tmp/mcp-e2e.out
          done

      - name: Multi-uid isolation suite (custody + privilege drop, as root)
        run: ./scripts/linux-harness.sh isolation

      - name: Trust-domain split e2e (real daemon, two uids, signed approver)
        run: ./scripts/linux-harness.sh e2e-split

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check supply chain
        uses: EmbarkStudios/cargo-deny-action@v2
