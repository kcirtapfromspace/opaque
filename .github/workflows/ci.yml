name: Rust CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run workspace tests
        run: cargo test --workspace

      - name: Verify wrapper enforcement handshake test
        # --exact needs the full module path; a bare name matches 0 tests and
        # passes vacuously. The grep guard fails the step if the test ever
        # stops running (renamed/moved), instead of silently passing.
        run: |
          cargo test -p opaqued tests::enforce_agent_sessions_rejects_unwrapped_and_allows_session_token -- --exact 2>&1 | tee /tmp/wrapper-test.out
          grep -q "test result: ok. 1 passed" /tmp/wrapper-test.out

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check supply chain
        uses: EmbarkStudios/cargo-deny-action@v2
