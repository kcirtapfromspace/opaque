# Cloudflare Pages — opaque.info
#
# The site is published by direct upload from CI
# (.github/workflows/deploy-site.yml), so the whole pipeline lives in this
# repository rather than half of it in a dashboard. A push to main publishes
# production; every other ref publishes a preview under its own URL.
#
# Deploying by hand does the same thing:
#
#   uv pip install -r docs/requirements.txt
#   mkdocs build --strict
#   wrangler pages deploy            # directory and project come from this file
#
# The project already exists as a direct-upload project (no Git provider), with
# opaque.info and www.opaque.info attached and `main` as its production branch —
# so a deploy on any other branch is automatically a preview. To recreate it:
#
#   wrangler pages project create opaque   # production branch: main
#
# and in CI, two repository secrets: CLOUDFLARE_API_TOKEN (Account → Cloudflare
# Pages → Edit) and CLOUDFLARE_ACCOUNT_ID. Without them the workflow still
# builds — it just skips the upload instead of failing.
#
# Canonical URLs and the sitemap point at opaque.info (mkdocs.yml `site_url`),
# so the GitHub Pages mirror never competes with it in search results.

name = "opaque"
pages_build_output_dir = "site"
compatibility_date = "2026-09-03"
