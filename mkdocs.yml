site_name: Opaque
site_description: Secrets stay secret. Agents stay powerful. A local, approval-gated secrets broker for AI coding tools.
site_url: https://opaque.info/
repo_url: https://github.com/kcirtapfromspace/opaque
repo_name: kcirtapfromspace/opaque
docs_dir: docs
exclude_docs: |
  README.md
  overrides/
  product/**
  dogfood.md
  release-dogfood.md
  tenant-boundaries.md

theme:
  name: material
  custom_dir: docs/overrides
  icon:
    logo: material/shield-lock
  # Local licensed fonts come from the shared brand foundation.
  font: false
  favicon: brand/opaque-mark.svg
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.integrate

markdown_extensions:
  - toc:
      permalink: true
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - tables
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search

hooks:
  - scripts/mkdocs_brand.py

extra_css:
  - brand/opaque.css
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/kcirtapfromspace/opaque

copyright: "Copyright &copy; 2026 Patrick Deutsch"

nav:
  - Home: index.md
  - Getting Started:
      - Tutorial: tutorial.md
      - Quick Start: getting-started.md
      - Demos: demos.md
      - Web Dashboard: web-dashboard.md
  - Configuration:
      - Policy Engine: policy.md
      - Identity: identity.md
      - Federation: federation.md
      - Bounded Agent Work: bounded-work.md
      - Operations: operations.md
      - Storage: storage.md
      - Deployment: deployment.md
  - Integrations:
      - MCP (Claude Code): mcp-integration.md
      - Bitwarden: bitwarden.md
      - HashiCorp Vault: vault.md
      - LLM Harness: llm-harness.md
  - Platform:
      - Linux polkit: linux-polkit.md
      - Mobile Approvals: mobile-approvals.md
      - Remote Approvals: remote-approvals.md
      - Enterprise Architecture: enterprise-architecture.md
  - Security:
      - Security Assessment: security-assessment.md
      - Adversarial Review: adversarial-security-review-2026-02-14.md
      - Audit Analytics: audit-analytics.md
  - Architecture:
      - Building on the Core: reusable-core.md
      - Design Notes: architecture.md
      - Deferred: roadmap-deferred.md
  - Blog:
      - Why We Built Opaque: blog/why-we-built-opaque.md
