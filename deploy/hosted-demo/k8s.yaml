# Operator-rendered template. Never apply with unresolved ${...} values.
# Default capacity: one slot. The controller cannot create namespaces or RBAC.
apiVersion: v1
kind: Namespace
metadata:
  name: opaque-demo-system
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.35
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: opaque-demo-controller
  namespace: opaque-demo-system
automountServiceAccountToken: true
---
apiVersion: v1
kind: Namespace
metadata:
  name: opaque-demo-slot-0
  labels:
    opaque.dev/demo-slot: "true"
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.35
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: opaque-demo-runtime
  namespace: opaque-demo-slot-0
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: opaque-demo-slot-state
  namespace: opaque-demo-slot-0
data:
  state: '{"schema_version":1,"generation":0,"lease_id":null}'
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: opaque-demo-capacity
  namespace: opaque-demo-slot-0
spec:
  hard:
    pods: "1"
    services: "1"
    secrets: "1"
    configmaps: "1"
    persistentvolumeclaims: "0"
    services.nodeports: "0"
    services.loadbalancers: "0"
    requests.cpu: 100m
    requests.memory: 128Mi
    limits.cpu: 500m
    limits.memory: 384Mi
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: opaque-demo-slot-controller
  namespace: opaque-demo-slot-0
rules:
  - apiGroups: [""]
    resources: [pods, services, secrets]
    verbs: [get, create, delete]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [opaque-demo-slot-state]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: opaque-demo-slot-controller
  namespace: opaque-demo-slot-0
subjects:
  - kind: ServiceAccount
    name: opaque-demo-controller
    namespace: opaque-demo-system
roleRef:
  kind: Role
  name: opaque-demo-slot-controller
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opaque-demo-controller
  namespace: opaque-demo-system
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: opaque-demo-controller
  template:
    metadata:
      labels:
        app: opaque-demo-controller
    spec:
      serviceAccountName: opaque-demo-controller
      automountServiceAccountToken: true
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/arch: arm64
      securityContext:
        runAsNonRoot: true
        runAsUser: 7383
        runAsGroup: 7383
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: ${RUNTIME_IMAGE}
          imagePullPolicy: IfNotPresent
          command: [python3, /opt/opaque/deploy/hosted-demo/controller.py]
          env:
            - name: OPAQUE_DEMO_WORKER_URL
              value: ${WORKER_ORIGIN}
            - name: OPAQUE_DEMO_CONTROLLER_SECRET
              valueFrom:
                secretKeyRef:
                  name: opaque-demo-controller-auth
                  key: controller-secret
            - name: OPAQUE_DEMO_SLOT_NAMESPACES
              value: opaque-demo-slot-0
            - name: OPAQUE_DEMO_RUNTIME_IMAGE
              value: ${RUNTIME_IMAGE}
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          ports:
            - name: proxy
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: opaque-demo-controller
  namespace: opaque-demo-system
spec:
  type: ClusterIP
  selector:
    app: opaque-demo-controller
  ports:
    - name: proxy
      port: 8080
      targetPort: 8080
