# Optional second slot. Also set the Worker capacity to2 and controller
# OPAQUE_DEMO_SLOT_NAMESPACES=opaque-demo-slot-0,opaque-demo-slot-1.
apiVersion: v1
kind: Namespace
metadata:
  name: opaque-demo-slot-1
  labels:
    opaque.dev/demo-slot: "true"
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.35
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: opaque-demo-runtime
  namespace: opaque-demo-slot-1
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: opaque-demo-slot-state
  namespace: opaque-demo-slot-1
data:
  state: '{"schema_version":1,"generation":0,"lease_id":null}'
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: opaque-demo-capacity
  namespace: opaque-demo-slot-1
spec:
  hard:
    pods: "1"
    services: "1"
    secrets: "1"
    configmaps: "1"
    persistentvolumeclaims: "0"
    services.nodeports: "0"
    services.loadbalancers: "0"
    requests.cpu: 100m
    requests.memory: 128Mi
    limits.cpu: 500m
    limits.memory: 384Mi
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: opaque-demo-slot-controller
  namespace: opaque-demo-slot-1
rules:
  - apiGroups: [""]
    resources: [pods, services, secrets]
    verbs: [get, create, delete]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [opaque-demo-slot-state]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: opaque-demo-slot-controller
  namespace: opaque-demo-slot-1
subjects:
  - kind: ServiceAccount
    name: opaque-demo-controller
    namespace: opaque-demo-system
roleRef:
  kind: Role
  name: opaque-demo-slot-controller
  apiGroup: rbac.authorization.k8s.io
