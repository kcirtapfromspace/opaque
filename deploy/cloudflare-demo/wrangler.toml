name = "opaque-demo"
main = "src/worker.mjs"
compatibility_date = "2026-09-04"
workers_dev = false
preview_urls = false

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[vars]
PUBLIC_ORIGIN = "https://demo.opaque.info"
DEMO_ENABLED = "true"
DEMO_CAPACITY = "1"
DEMO_MODEL_IDS = "gemma4-e2b,qwen35-4b"
DEMO_DEFAULT_MODEL = "qwen35-4b"
TURNSTILE_SITE_KEY = "0x4AAAAAAEoQ04XT_P5oVyBR"
CONTROLLER_ORIGIN = "http://opaque-demo-controller.opaque-demo-system.svc.cluster.local:8080"

[[durable_objects.bindings]]
name = "DEMO_SCHEDULER"
class_name = "DemoScheduler"

[[durable_objects.bindings]]
name = "LEAD_INBOX"
class_name = "LeadInbox"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DemoScheduler"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["LeadInbox"]

[[routes]]
pattern = "demo.opaque.info"
custom_domain = true

[[vpc_services]]
binding = "DEMO_ORIGIN"
service_id = "01a06f35-01e7-7f30-b3ca-bd99e3a7a673"
