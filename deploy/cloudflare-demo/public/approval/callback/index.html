<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Return to Opaque approval</title>
<script>
(() => {
  const parameters = new URLSearchParams(location.search);
  history.replaceState(null, '', '/approval/callback');
  const state = parameters.get('state');
  const code = parameters.get('code');
  const error = parameters.get('error');
  const unique = ['state', 'code', 'error'].every(key => parameters.getAll(key).length <= 1);
  if (!unique || !state || !/^[A-Za-z0-9_-]{1,512}$/.test(state) || !window.opener) return;
  if (error) {
    window.opener.postMessage({type: 'opaque-approval-oauth', state, error: 'authorization_failed'}, location.origin);
  } else if (code && code.length <= 4096 && !/[\u0000-\u0020\u007f]/.test(code)) {
    window.opener.postMessage({type: 'opaque-approval-oauth', state, code}, location.origin);
  } else return;
  window.close();
})();
</script>
<style>body{margin:3rem auto;padding:0 1.5rem;max-width:32rem;font:16px/1.6 system-ui,sans-serif;background:#f7f7f3;color:#222}h1{font-size:1.4rem}</style>
</head>
<body><h1>Return to your approval window</h1><p>You can close this window and continue in Opaque.</p></body>
</html>
