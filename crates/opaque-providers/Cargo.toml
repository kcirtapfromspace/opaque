[package]
name = "opaque-providers"
version.workspace = true
edition = "2024"
publish = false
description = "Opaque credential provider integrations (AWS, Azure, GCP, GitHub, GitLab, 1Password, Bitwarden, Doppler, Infisical, Vault)"
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
opaque-core = { path = "../opaque-core" }
aws-sigv4 = { version = "1.5.1", default-features = false, features = ["sign-http", "http1"], optional = true }
aws-credential-types = { version = "1.3", optional = true }
base64 = { workspace = true }
chrono = { workspace = true }
crypto_box = { workspace = true }
jsonwebtoken = { workspace = true }
libc = { workspace = true }
quick-xml = { version = "0.39", features = ["serialize"], optional = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
zeroize = { workspace = true }
tempfile = { version = "3", optional = true }

[dev-dependencies]
tempfile = "3"
wiremock = { workspace = true }

[features]
# GCP and Azure are optional here and explicitly enabled/wired by opaqued.
# Doppler and Infisical retain their compiled clients but have no daemon handlers.
default = ["github", "gitlab", "onepassword", "bitwarden", "vault", "aws"]

# `github/task.rs` hard-imports `vault::client`/`vault::resolve` directly
# (staging-release manifest planning resolves a Vault-signed value as part of
# the same flow), so `github` cannot compile without `vault`.
github = ["vault"]
gitlab = []
onepassword = []
bitwarden = ["dep:tempfile"]
vault = []
aws = ["dep:aws-sigv4", "dep:aws-credential-types", "dep:quick-xml"]
gcp = []
azure = []
doppler = []
infisical = []
