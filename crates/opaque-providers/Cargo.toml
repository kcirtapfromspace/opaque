[package]
name = "opaque-providers"
version.workspace = true
edition = "2024"
publish = false
description = "Opaque credential provider integrations (AWS, Azure, GCP, GitHub, GitLab, 1Password, Bitwarden, Doppler, Infisical, Vault)"
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
opaque-core = { path = "../opaque-core" }
base64 = { workspace = true }
chrono = { workspace = true }
crypto_box = { workspace = true }
jsonwebtoken = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tempfile = "3"
wiremock = { workspace = true }

[features]
# The six providers actually wired into opaqued's `default_secret_resolvers()`
# / operation registry today. `gcp`, `azure`, `doppler`, and `infisical` are
# dormant (compiled client/resolver code with zero operations registered and
# zero handler wiring anywhere) — kept out of `default` so a plain
# `cargo build -p opaque-providers` doesn't pay for them, while `opaqued`'s
# own Cargo.toml opts back into all ten explicitly so its shipped behavior is
# unchanged by this feature system's introduction.
default = ["github", "gitlab", "onepassword", "bitwarden", "vault", "aws"]

# `github/task.rs` hard-imports `vault::client`/`vault::resolve` directly
# (staging-release manifest planning resolves a Vault-signed value as part of
# the same flow), so `github` cannot compile without `vault`.
github = ["vault"]
gitlab = []
onepassword = []
bitwarden = []
vault = []
aws = []
gcp = []
azure = []
doppler = []
infisical = []
