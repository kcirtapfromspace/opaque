[package]
name = "opaque-native-approval"
version.workspace = true
edition = "2024"
publish = false
description = "Shared native review and authentication for Opaque"
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
libc = { workspace = true }
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = { version = "0.6.3", default-features = false, features = ["std"] }
objc2-foundation = "0.3.2"
objc2-local-authentication = { version = "0.3.2", default-features = false, features = ["std", "block2", "LAContext"] }
