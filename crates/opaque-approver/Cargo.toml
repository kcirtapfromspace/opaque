[package]
name = "opaque-approver"
version.workspace = true
edition = "2024"
publish = false
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Trusted paired-workstation full-manifest approver for Opaque"

[dependencies]
opaque-core = { path = "../opaque-core" }
opaque-native-approval = { path = "../opaque-native-approval" }
clap = { workspace = true }
ed25519-dalek = { workspace = true }
getrandom = { workspace = true }
libc = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
tempfile = "3"
rcgen = { workspace = true }
tokio-rustls = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-local-authentication = { version = "0.3.2", default-features = false, features = ["std", "block2", "LAContext"] }
