# Reviewed contract template. Do not install or dispatch without operator review.
# This runs a fixed artifact smoke check in the staging environment; no rollout.
name: Opaque staging artifact smoke check
run-name: opaque-staging:${{ inputs.opaque_task_id }}:${{ inputs.opaque_manifest_digest }}

on:
  workflow_dispatch:
    inputs:
      opaque_task_id:
        required: true
        type: string
      opaque_manifest_digest:
        required: true
        type: string
      approved_commit_sha:
        required: true
        type: string
      image_repository:
        required: true
        type: string
      image_digest:
        required: true
        type: string
      environment:
        required: true
        type: choice
        options:
          - staging

permissions: {}
concurrency:
  group: opaque-staging-${{ inputs.opaque_task_id }}
  cancel-in-progress: false

jobs:
  staging-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    env:
      OPAQUE_TASK_ID: ${{ inputs.opaque_task_id }}
      OPAQUE_MANIFEST_DIGEST: ${{ inputs.opaque_manifest_digest }}
      APPROVED_COMMIT_SHA: ${{ inputs.approved_commit_sha }}
      IMAGE_REPOSITORY: ${{ inputs.image_repository }}
      IMAGE_DIGEST: ${{ inputs.image_digest }}
      REQUESTED_ENVIRONMENT: ${{ inputs.environment }}
      OBSERVED_REPOSITORY_ID: ${{ github.repository_id }}
    steps:
      - name: Enforce the reviewed staging contract
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$OBSERVED_REPOSITORY_ID" = 1156844526
          test "$GITHUB_REPOSITORY" = kcirtapfromspace/opaque
          test "$GITHUB_REF" = refs/heads/main
          test "$REQUESTED_ENVIRONMENT" = staging
          test "$IMAGE_REPOSITORY" = ghcr.io/kcirtapfromspace/opaque
          [[ "$OPAQUE_TASK_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]
          [[ "$OPAQUE_MANIFEST_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          [[ "$APPROVED_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$GITHUB_SHA" = "$APPROVED_COMMIT_SHA"
      - name: Fetch the immutable staging artifact
        shell: bash
        run: |
          set -euo pipefail
          artifact="$IMAGE_REPOSITORY@$IMAGE_DIGEST"
          docker pull --quiet "$artifact"
          revision="$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$artifact")"
          test "$revision" = "$APPROVED_COMMIT_SHA"
      - name: Smoke check the approved artifact without deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 128 --memory 256m \
            --cpus 1 --user 65532:65532 --entrypoint /usr/local/bin/opaque \
            "$IMAGE_REPOSITORY@$IMAGE_DIGEST" --version
          printf '%s\n' 'Approved staging artifact smoke check completed. No service rollout performed.'
